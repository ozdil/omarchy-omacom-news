[package]
name = "omacomnews-engine"
version = "1.2.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Omarchy Linux news, distro releases, and desktop notification engine"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
